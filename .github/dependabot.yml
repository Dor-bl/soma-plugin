version: 2
updates:
  # Actions are pinned to commit SHAs; this proposes the bumps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # appium-mcp and its lockfile. A bump must also move the pin in scripts/start-appium-mcp.mjs
  # and the README (check-plugin.mjs fails otherwise), so expect to touch those in the PR.
  - package-ecosystem: npm
    directory: /runtime
    schedule:
      interval: weekly
