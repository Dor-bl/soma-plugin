name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: catch upstream appium-mcp changes and dead links without a commit
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .
      - name: Structure checks (frontmatter, userConfig, version badge)
        run: node scripts/check-plugin.mjs

  docs:
    name: Markdown lint and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,429 "**/*.md"
          fail: true

  mcp-smoke:
    name: appium-mcp smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Handshake and check required tools
        run: node scripts/mcp-smoke.mjs
        timeout-minutes: 5
