name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly (Linux only): catch upstream appium-mcp changes and dead links without a commit
    - cron: "17 3 * * 0,2-6"
    # Weekly (Mondays): also run macOS and Windows, which bill at 10x and 2x minutes
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .
      - name: Structure checks (frontmatter, userConfig, version badge)
        run: node scripts/check-plugin.mjs
      - name: Remote server allowlist tests
        run: node scripts/test-allowlist.mjs
      - name: Process-tree cleanup tests
        run: node scripts/test-process-tree.mjs
      - name: Triage command contract tests
        run: node scripts/test-triage-command.mjs
      - name: Injection-check matching tests
        run: node scripts/test-injection-match.mjs

  docs:
    name: Markdown lint and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,429 "**/*.md"
          fail: true

  mcp-smoke:
    name: appium-mcp smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only by default; the full OS matrix runs on the weekly schedule and manual runs.
        include: ${{ fromJSON((github.event.schedule == '17 3 * * 1' || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"macos-latest","node":22},{"os":"windows-latest","node":22}]' || '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Cache the folder the launcher installs appium-mcp into (CLAUDE_PLUGIN_DATA below),
      # so later runs skip the npm ci install (close to 8 min on Windows runners).
      # The key hashes the lockfile, so any change to the locked tree gets a fresh
      # cold install and a new cache.
      - name: Cache appium-mcp install
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/soma-plugin-data
          key: appium-mcp-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('runtime/package-lock.json') }}
      - name: Handshake and check required tools
        run: node scripts/mcp-smoke.mjs
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/soma-plugin-data
          # Room for a cold install (close to 8 min on Windows runners), which only happens
          # when the lockfile changes. The cache is only saved when the job passes, so a limit
          # too tight for a cold install would mean the cache is never filled.
          SMOKE_TIMEOUT_MS: "720000"
        timeout-minutes: 15
